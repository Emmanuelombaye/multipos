name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend at $(date)"
          curl -f https://multipos.onrender.com/health || echo "Backend is down"
          
      - name: Ping API Endpoint
        run: |
          curl -f https://multipos.onrender.com/api/branches || echo "API check failed (expected if not authenticated)"
